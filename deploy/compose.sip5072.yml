# Persist FreeSWITCH's internal SIP port at 5072.
#
# The edge router at the public IP runs a SIP ALG on 5060: it rewrites the
# SIP payload (220.197.177.220 -> 10.1.91.56) and the SDP media port (a
# controlled probe sent m=audio 5098 and arrived as m=audio 5100), which
# breaks RTP in both directions. FreeSWITCH therefore listens on 5072 and the
# edge maps 5072/udp to 10.1.91.56:5072, where the ALG does not look.
#
# The image's vars.xml says internal_sip_port=5060. The file mounted here is
# a copy of that vars.xml with 5072; deploy/prepare-fs-vars.sh generates it.
# A switch image upgrade changes the base vars.xml, so re-run the script.
services:
  freeswitch:
    volumes:
      - ${AICC_FS_VARS_FILE:-./freeswitch-vars.xml}:/usr/local/freeswitch/conf/vars.xml
